<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Officers — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Officer Management</div>

    <div th:if="${successMessage}" class="alert alert-success auto-dismiss" th:text="${successMessage}"></div>

    <div class="action-bar">
        <a th:href="@{/admin/officers/add}" class="btn btn-primary">+ Add Officer</a>
    </div>

    <div th:if="${#lists.isEmpty(officers)}" class="alert alert-info">No officers found.</div>
    <table class="data-table" th:unless="${#lists.isEmpty(officers)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Designation</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Unit</th>
                <th>Username</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="officer, iter : ${officers}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${officer.name}">Name</td>
                <td th:text="${officer.designation}">ANO</td>
                <td th:text="${officer.email}">email</td>
                <td th:text="${officer.phone}">phone</td>
                <td th:text="${officer.unit != null ? officer.unit.unitName : 'N/A'}">Unit</td>
                <td th:text="${officer.user != null ? officer.user.username : 'N/A'}">username</td>
                <td>
                    <a th:href="@{/admin/officers/edit/{id}(id=${officer.id})}"
                       class="btn btn-secondary btn-sm">Edit</a>
                    <a th:href="@{/admin/officers/delete/{id}(id=${officer.id})}"
                       class="btn btn-danger btn-sm"
                       data-confirm="Delete this officer? Their login account will also be removed.">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
