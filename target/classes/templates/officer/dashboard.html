<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Officer Dashboard — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Officer Dashboard</div>

    <!-- Officer Info -->
    <div th:if="${officer != null}" style="margin-bottom:14px;">
        <strong>Welcome,</strong>
        <span th:text="${officer.name}">Officer Name</span>
        &nbsp;|&nbsp;
        <strong>Unit:</strong>
        <span th:text="${officer.unit != null ? officer.unit.unitName : 'Not Assigned'}">Unit</span>
        &nbsp;|&nbsp;
        <strong>Designation:</strong>
        <span th:text="${officer.designation}">Designation</span>
    </div>

    <!-- Stats -->
    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-label">Cadets in Unit</div>
            <div class="stat-value" th:text="${stats != null ? stats.cadetsInUnit : 0}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Upcoming Camps</div>
            <div class="stat-value" th:text="${stats != null ? stats.upcomingCamps : 0}">0</div>
        </div>
    </div>

    <hr class="section-divider"/>

    <!-- Quick Actions -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
        <a th:href="@{/cadets}" class="btn btn-primary">View Cadets</a>
        <a th:href="@{/attendance/mark}" class="btn btn-primary">Mark Attendance</a>
        <a th:href="@{/attendance/report}" class="btn btn-secondary">Attendance Report</a>
        <a th:href="@{/notices/add}" class="btn btn-primary">Post Notice</a>
        <a th:href="@{/certificates}" class="btn btn-secondary">Certificates</a>
    </div>

    <hr class="section-divider"/>

    <!-- Recent Notices -->
    <div class="page-title" style="font-size:13px;margin-bottom:10px;">Recent Notices for Officers</div>
    <div th:if="${#lists.isEmpty(notices)}" class="alert alert-info">No notices at this time.</div>
    <table class="data-table" th:unless="${#lists.isEmpty(notices)}">
        <thead>
            <tr><th>#</th><th>Title</th><th>Posted By</th><th>Date</th></tr>
        </thead>
        <tbody>
            <tr th:each="notice, iter : ${notices}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${notice.title}">Title</td>
                <td th:text="${notice.postedBy}">Admin</td>
                <td th:text="${#temporals.format(notice.postedDate, 'dd-MM-yyyy')}">Date</td>
            </tr>
        </tbody>
    </table>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
