<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cadet List — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Cadet Management</div>

    <div th:if="${successMessage}" class="alert alert-success auto-dismiss" th:text="${successMessage}"></div>

    <!-- Search and Filter Bar -->
    <form method="get" th:action="@{/cadets}" class="search-bar">
        <input type="text" name="search" id="searchQuery"
               th:value="${search}" placeholder="Search by name, email, or cadet ID"/>
        <select name="unitId" class="form-control" style="width:180px;">
            <option value="">-- All Units --</option>
            <option th:each="unit : ${units}"
                    th:value="${unit.id}"
                    th:text="${unit.unitName}"
                    th:selected="${selectedUnitId != null && selectedUnitId == unit.id}">Unit</option>
        </select>
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:href="@{/cadets}" class="btn btn-secondary">Reset</a>
        <a th:href="@{/cadets/add}" class="btn btn-success" style="margin-left:auto;">+ Add Cadet</a>
        <a th:href="@{/reports/export/cadets}" class="btn btn-secondary">Export CSV</a>
    </form>

    <!-- Results summary -->
    <div style="font-size:12px;color:#555;margin-bottom:8px;">
        Showing <strong th:text="${#lists.size(cadets)}">0</strong> of
        <strong th:text="${totalElements}">0</strong> cadets.
    </div>

    <!-- Cadet Table -->
    <div th:if="${#lists.isEmpty(cadets)}" class="alert alert-info">No cadets found matching your criteria.</div>
    <table class="data-table" th:unless="${#lists.isEmpty(cadets)}">
        <thead>
            <tr>
                <th>#</th>
                <th><a th:href="@{/cadets(page=${currentPage}, sortField='cadetId', sortDir=${sortField == 'cadetId' ? reverseSortDir : 'asc'})}">Cadet ID</a></th>
                <th><a th:href="@{/cadets(page=${currentPage}, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'})}">Name &#x2195;</a></th>
                <th>Gender</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Unit</th>
                <th>Rank</th>
                <th>Blood Group</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cadet, iter : ${cadets}">
                <td th:text="${currentPage * 10 + iter.count}">1</td>
                <td th:text="${cadet.cadetId}">NCC/2024/001</td>
                <td th:text="${cadet.name}">Name</td>
                <td th:text="${cadet.gender}">MALE</td>
                <td th:text="${cadet.email}">email</td>
                <td th:text="${cadet.phone}">phone</td>
                <td th:text="${cadet.unit != null ? cadet.unit.unitName : 'N/A'}">Unit</td>
                <td th:text="${cadet.rank}">CADET</td>
                <td th:text="${cadet.bloodGroup ?: 'N/A'}">B+</td>
                <td>
                    <a th:href="@{/cadets/view/{id}(id=${cadet.id})}" class="btn btn-secondary btn-sm">View</a>
                    <a th:href="@{/cadets/edit/{id}(id=${cadet.id})}" class="btn btn-primary btn-sm">Edit</a>
                    <a th:href="@{/cadets/delete/{id}(id=${cadet.id})}"
                       class="btn btn-danger btn-sm"
                       data-confirm="Delete this cadet? This will also remove their login account.">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <ul class="pagination" th:if="${totalPages > 1}">
        <li th:classappend="${currentPage == 0} ? 'disabled' : ''">
            <a th:href="@{/cadets(page=${currentPage - 1}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}">&laquo; Prev</a>
        </li>
        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active' : ''">
            <span th:if="${i == currentPage}" th:text="${i + 1}">1</span>
            <a th:unless="${i == currentPage}"
               th:href="@{/cadets(page=${i}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
               th:text="${i + 1}">1</a>
        </li>
        <li th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
            <a th:href="@{/cadets(page=${currentPage + 1}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}">Next &raquo;</a>
        </li>
    </ul>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
