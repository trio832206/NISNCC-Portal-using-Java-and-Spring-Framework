<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Post Notice — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Notice Board &mdash; Post New Notice</div>

    <div class="form-container" style="max-width:600px;">
        <form th:action="@{/notices/add}"
              th:object="${noticeDTO}"
              method="post"
              class="no-double-submit">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="title" class="required">Notice Title</label>
                <div>
                    <input type="text" id="title" th:field="*{title}" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''"
                           placeholder="Brief title of the notice"/>
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="message" class="required">Message</label>
                <div>
                    <textarea id="message" th:field="*{message}" class="form-control"
                              style="height:120px;"
                              th:classappend="${#fields.hasErrors('message')} ? ' is-invalid' : ''"
                              placeholder="Full notice message..."></textarea>
                    <span th:if="${#fields.hasErrors('message')}" th:errors="*{message}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="targetRole" class="required">Audience</label>
                <div>
                    <select id="targetRole" th:field="*{targetRole}" class="form-control"
                            th:classappend="${#fields.hasErrors('targetRole')} ? ' is-invalid' : ''">
                        <option value="">-- Select Audience --</option>
                        <option th:each="role : ${targetRoles}" th:value="${role}" th:text="${role}">ALL</option>
                    </select>
                    <span th:if="${#fields.hasErrors('targetRole')}" th:errors="*{targetRole}" class="invalid-feedback"></span>
                    <small style="color:#666;">ALL = visible to everyone; select a specific role to target.</small>
                </div>
            </div>

            <div class="form-group" style="margin-top:14px;border-top:1px solid #ddd;padding-top:12px;">
                <label></label>
                <div>
                    <button type="submit" class="btn btn-primary">Post Notice</button>
                    <a th:href="@{/notices}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
