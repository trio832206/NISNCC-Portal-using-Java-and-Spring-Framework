<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Unit Form — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title" th:text="${formTitle}">Add / Edit Unit</div>

    <div class="form-container">
        <form th:action="${unitDTO.id != null ? '/units/edit/' + unitDTO.id : '/units/add'}"
              th:object="${unitDTO}"
              method="post"
              class="no-double-submit">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="unitName" class="required">Unit Name</label>
                <div>
                    <input type="text" id="unitName" th:field="*{unitName}" class="form-control"
                           th:classappend="${#fields.hasErrors('unitName')} ? ' is-invalid' : ''"
                           placeholder="e.g., 1 TN Bn NCC"/>
                    <span th:if="${#fields.hasErrors('unitName')}" th:errors="*{unitName}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="battalion" class="required">Battalion</label>
                <div>
                    <input type="text" id="battalion" th:field="*{battalion}" class="form-control"
                           th:classappend="${#fields.hasErrors('battalion')} ? ' is-invalid' : ''"
                           placeholder="e.g., 1 TN Bn"/>
                    <span th:if="${#fields.hasErrors('battalion')}" th:errors="*{battalion}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="state" class="required">State</label>
                <div>
                    <input type="text" id="state" th:field="*{state}" class="form-control"
                           th:classappend="${#fields.hasErrors('state')} ? ' is-invalid' : ''"
                           placeholder="e.g., Tamil Nadu"/>
                    <span th:if="${#fields.hasErrors('state')}" th:errors="*{state}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="district" class="required">District</label>
                <div>
                    <input type="text" id="district" th:field="*{district}" class="form-control"
                           th:classappend="${#fields.hasErrors('district')} ? ' is-invalid' : ''"
                           placeholder="e.g., Chennai"/>
                    <span th:if="${#fields.hasErrors('district')}" th:errors="*{district}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control"
                          placeholder="Brief description (optional)"></textarea>
            </div>

            <div class="form-group" style="margin-top:14px;border-top:1px solid #ddd;padding-top:12px;">
                <label></label>
                <div>
                    <button type="submit" class="btn btn-primary">Save Unit</button>
                    <a th:href="@{/units}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
