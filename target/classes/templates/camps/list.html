<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camps — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Camp Management</div>

    <div th:if="${successMessage}" class="alert alert-success auto-dismiss" th:text="${successMessage}"></div>

    <div class="action-bar">
        <a th:href="@{/camps/add}" class="btn btn-primary">+ Add Camp</a>
    </div>

    <div th:if="${#lists.isEmpty(camps)}" class="alert alert-info">No camps found.</div>

    <table class="data-table" th:unless="${#lists.isEmpty(camps)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Camp Name</th>
                <th>Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Location</th>
                <th>Max Cadets</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="camp, iter : ${camps}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${camp.campName}">Camp Name</td>
                <td th:text="${camp.type}">ATC</td>
                <td th:text="${#temporals.format(camp.startDate, 'dd-MM-yyyy')}">Date</td>
                <td th:text="${#temporals.format(camp.endDate, 'dd-MM-yyyy')}">Date</td>
                <td th:text="${camp.location ?: 'N/A'}">Location</td>
                <td th:text="${camp.maxCadets ?: 'N/A'}">50</td>
                <td>
                    <a th:href="@{/camps/{id}/registrations(id=${camp.id})}" class="btn btn-secondary btn-sm">Registrations</a>
                    <a th:href="@{/camps/edit/{id}(id=${camp.id})}" class="btn btn-primary btn-sm">Edit</a>
                    <a th:href="@{/camps/delete/{id}(id=${camp.id})}"
                       class="btn btn-danger btn-sm"
                       data-confirm="Delete this camp?">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
