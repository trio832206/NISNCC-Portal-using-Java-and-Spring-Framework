<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camp Form — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title" th:text="${formTitle}">Add / Edit Camp</div>

    <div class="form-container" style="max-width:600px;">
        <form th:action="${campDTO.id != null ? '/camps/edit/' + campDTO.id : '/camps/add'}"
              th:object="${campDTO}"
              method="post"
              class="no-double-submit">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="campName" class="required">Camp Name</label>
                <div>
                    <input type="text" id="campName" th:field="*{campName}" class="form-control"
                           th:classappend="${#fields.hasErrors('campName')} ? ' is-invalid' : ''"
                           placeholder="e.g., Annual Training Camp 2024"/>
                    <span th:if="${#fields.hasErrors('campName')}" th:errors="*{campName}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="type" class="required">Camp Type</label>
                <select id="type" th:field="*{type}" class="form-control">
                    <option value="">-- Select Type --</option>
                    <option th:each="t : ${campTypes}" th:value="${t}" th:text="${t}">ATC</option>
                </select>
            </div>

            <div class="form-group">
                <label for="startDate" class="required">Start Date</label>
                <div>
                    <input type="date" id="startDate" th:field="*{startDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('startDate')} ? ' is-invalid' : ''"/>
                    <span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="endDate" class="required">End Date</label>
                <div>
                    <input type="date" id="endDate" th:field="*{endDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('endDate')} ? ' is-invalid' : ''"/>
                    <span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" th:field="*{location}" class="form-control"
                       placeholder="Camp venue / location"/>
            </div>

            <div class="form-group">
                <label for="maxCadets">Max Cadets</label>
                <input type="number" id="maxCadets" th:field="*{maxCadets}" class="form-control"
                       placeholder="Maximum number of cadets" min="1"/>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control"
                          placeholder="Brief description of the camp"></textarea>
            </div>

            <div class="form-group" style="margin-top:14px;border-top:1px solid #ddd;padding-top:12px;">
                <label></label>
                <div>
                    <button type="submit" class="btn btn-primary">Save Camp</button>
                    <a th:href="@{/camps}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
