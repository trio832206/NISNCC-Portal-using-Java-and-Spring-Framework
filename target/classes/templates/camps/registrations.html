<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camp Registrations — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">
        Camp Registrations &mdash; <span th:text="${camp.campName}">Camp Name</span>
    </div>

    <div th:if="${successMessage}" class="alert alert-success auto-dismiss" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Camp Info -->
    <div style="font-size:13px;margin-bottom:14px;background:#e8eef5;
                padding:10px;border:1px solid #ccd;">
        <strong>Type:</strong> <span th:text="${camp.type}">ATC</span> &nbsp;|&nbsp;
        <strong>Start:</strong> <span th:text="${#temporals.format(camp.startDate, 'dd-MM-yyyy')}">Date</span> &nbsp;|&nbsp;
        <strong>End:</strong> <span th:text="${#temporals.format(camp.endDate, 'dd-MM-yyyy')}">Date</span> &nbsp;|&nbsp;
        <strong>Location:</strong> <span th:text="${camp.location ?: 'N/A'}">Location</span> &nbsp;|&nbsp;
        <strong>Max Cadets:</strong> <span th:text="${camp.maxCadets ?: 'N/A'}">50</span>
    </div>

    <!-- Register Cadet -->
    <div style="margin-bottom:14px;border:1px solid #ccd;padding:12px;background:#fff;">
        <strong style="display:block;margin-bottom:8px;color:#003580;">Register a Cadet</strong>
        <form th:action="@{/camps/{id}/register(id=${camp.id})}" method="post" style="display:flex;gap:8px;align-items:center;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="cadetId" class="form-control" style="width:300px;" required>
                <option value="">-- Select Cadet --</option>
                <option th:each="cadet : ${cadets}"
                        th:value="${cadet.id}"
                        th:text="${cadet.cadetId + ' - ' + cadet.name}">Cadet</option>
            </select>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>

    <!-- Registered Cadets Table -->
    <div class="page-title" style="font-size:13px;margin-bottom:10px;">
        Registered Cadets (<span th:text="${#lists.size(registrations)}">0</span>)
    </div>

    <div th:if="${#lists.isEmpty(registrations)}" class="alert alert-info">
        No cadets registered for this camp yet.
    </div>

    <table class="data-table" th:unless="${#lists.isEmpty(registrations)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Cadet ID</th>
                <th>Name</th>
                <th>Unit</th>
                <th>Status</th>
                <th>Performance</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reg, iter : ${registrations}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${reg.cadet.cadetId}">NCC/2024/001</td>
                <td th:text="${reg.cadet.name}">Name</td>
                <td th:text="${reg.cadet.unit != null ? reg.cadet.unit.unitName : 'N/A'}">Unit</td>
                <td th:text="${reg.attendance}">REGISTERED</td>
                <td th:text="${reg.performance}">NOT_RATED</td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top:12px;">
        <a th:href="@{/camps}" class="btn btn-secondary">&laquo; Back to Camps</a>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
