<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Attendance Report — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Attendance Report</div>

    <div th:if="${successMessage}" class="alert alert-success auto-dismiss" th:text="${successMessage}"></div>

    <!-- Filter Form -->
    <form method="get" th:action="@{/attendance/report}" class="search-bar">
        <input type="date" name="date" th:value="${reportDate}"/>
        <select name="type" class="form-control" style="width:140px;">
            <option th:each="t : ${attendanceTypes}"
                    th:value="${t}"
                    th:text="${t}"
                    th:selected="${t == reportType}">PARADE</option>
        </select>
        <button type="submit" class="btn btn-primary">Filter</button>
        <a th:href="@{/reports/export/attendance}" class="btn btn-secondary">Export CSV</a>
        <a th:href="@{/attendance/mark}" class="btn btn-success" style="margin-left:auto;">+ Mark Attendance</a>
    </form>

    <!-- Summary -->
    <div style="font-size:12px;color:#555;margin-bottom:8px;">
        Showing attendance for <strong th:text="${#temporals.format(reportDate, 'dd-MM-yyyy')}">Date</strong>
        &mdash; Type: <strong th:text="${reportType}">PARADE</strong>
        &mdash; Total records: <strong th:text="${#lists.size(records)}">0</strong>
    </div>

    <div th:if="${#lists.isEmpty(records)}" class="alert alert-info">
        No attendance records found for the selected date and type.
    </div>

    <table class="data-table" th:unless="${#lists.isEmpty(records)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Cadet ID</th>
                <th>Cadet Name</th>
                <th>Date</th>
                <th>Type</th>
                <th>Status</th>
                <th>Remarks</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="att, iter : ${records}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${att.cadet.cadetId}">NCC/2024/001</td>
                <td th:text="${att.cadet.name}">Name</td>
                <td th:text="${#temporals.format(att.date, 'dd-MM-yyyy')}">Date</td>
                <td th:text="${att.type}">PARADE</td>
                <td>
                    <span th:text="${att.status}"
                          th:classappend="${att.status.name() == 'PRESENT'} ? 'badge badge-present' : 'badge badge-absent'"
                          class="badge">PRESENT</span>
                </td>
                <td th:text="${att.remarks ?: '-'}">-</td>
                <td>
                    <a th:href="@{/attendance/delete/{id}(id=${att.id})}"
                       class="btn btn-danger btn-sm"
                       data-confirm="Delete this attendance record?">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
