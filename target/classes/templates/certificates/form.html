<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Certificate Form — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Certificate Management &mdash; Add / Edit Record</div>

    <div class="form-container" style="max-width:500px;">
        <form th:action="${certificateDTO.id != null ? '/certificates/edit/' + certificateDTO.id : '/certificates/add'}"
              th:object="${certificateDTO}"
              method="post"
              class="no-double-submit">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="cadetId" class="required">Cadet</label>
                <div>
                    <select id="cadetId" th:field="*{cadetId}" class="form-control"
                            th:classappend="${#fields.hasErrors('cadetId')} ? ' is-invalid' : ''">
                        <option value="">-- Select Cadet --</option>
                        <option th:each="cadet : ${cadets}"
                                th:value="${cadet.id}"
                                th:text="${cadet.cadetId + ' - ' + cadet.name}">Cadet</option>
                    </select>
                    <span th:if="${#fields.hasErrors('cadetId')}" th:errors="*{cadetId}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="type" class="required">Certificate Type</label>
                <div>
                    <select id="type" th:field="*{type}" class="form-control"
                            th:classappend="${#fields.hasErrors('type')} ? ' is-invalid' : ''">
                        <option value="">-- Select Type --</option>
                        <option th:each="t : ${certTypes}" th:value="${t}"
                                th:text="'Certificate ' + ${t}">A</option>
                    </select>
                    <span th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="result" class="required">Result</label>
                <div>
                    <select id="result" th:field="*{result}" class="form-control"
                            th:classappend="${#fields.hasErrors('result')} ? ' is-invalid' : ''">
                        <option value="">-- Select Result --</option>
                        <option th:each="r : ${certResults}" th:value="${r}" th:text="${r}">PENDING</option>
                    </select>
                    <span th:if="${#fields.hasErrors('result')}" th:errors="*{result}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="examDate">Exam Date</label>
                <input type="date" id="examDate" th:field="*{examDate}" class="form-control"/>
            </div>

            <div class="form-group">
                <label for="remarks">Remarks</label>
                <input type="text" id="remarks" th:field="*{remarks}" class="form-control"
                       placeholder="Optional remarks"/>
            </div>

            <div class="form-group" style="margin-top:14px;border-top:1px solid #ddd;padding-top:12px;">
                <label></label>
                <div>
                    <button type="submit" class="btn btn-primary">Save Record</button>
                    <a th:href="@{/certificates}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
