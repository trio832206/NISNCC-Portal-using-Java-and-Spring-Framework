# =============================================
# NCC Cadet Management Portal - Configuration
# =============================================

# --- Server ---
server.port=8080

# --- MySQL DataSource ---
# IMPORTANT: Update username and password before running
spring.datasource.url=jdbc:mysql://localhost:3306/ncc_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
# IMPORTANT: Run data.sql AFTER Hibernate creates the schema (Spring Boot 2.5+ requirement)
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Ignore DDL script errors (warnings only, don't fail startup)
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Spring Security Session Timeout (30 minutes) ---
server.servlet.session.timeout=30m

# --- Application Name ---
spring.application.name=NCC Cadet Management Portal

# --- Logging ---
logging.level.com.nccportal=DEBUG
logging.level.org.springframework.security=INFO

# --- Multipart (file upload, if needed) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Initialize data.sql on startup ---
spring.sql.init.mode=always
# Don't fail startup if data.sql INSERT IGNORE raises duplicate-key warnings on repeat restarts
spring.sql.init.continue-on-error=true
