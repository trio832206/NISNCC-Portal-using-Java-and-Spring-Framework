<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Units — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Unit Management</div>

    <div th:if="${successMessage}" class="alert alert-success auto-dismiss" th:text="${successMessage}"></div>

    <div class="action-bar">
        <a th:href="@{/units/add}" class="btn btn-primary">+ Add Unit</a>
    </div>

    <div th:if="${#lists.isEmpty(units)}" class="alert alert-info">No units found. Add your first unit.</div>
    <table class="data-table" th:unless="${#lists.isEmpty(units)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Unit Name</th>
                <th>Battalion</th>
                <th>State</th>
                <th>District</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unit, iter : ${units}">
                <td th:text="${iter.count}">1</td>
                <td th:text="${unit.unitName}">Unit Name</td>
                <td th:text="${unit.battalion}">Battalion</td>
                <td th:text="${unit.state}">State</td>
                <td th:text="${unit.district}">District</td>
                <td th:text="${unit.description ?: '-'}">Description</td>
                <td>
                    <a th:href="@{/units/{id}/cadets(id=${unit.id})}" class="btn btn-secondary btn-sm">View Cadets</a>
                    <a th:href="@{/units/edit/{id}(id=${unit.id})}" class="btn btn-primary btn-sm">Edit</a>
                    <a th:href="@{/units/delete/{id}(id=${unit.id})}"
                       class="btn btn-danger btn-sm"
                       data-confirm="Delete this unit? Cadets in this unit will be unassigned.">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
