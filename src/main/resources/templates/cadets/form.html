<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cadet Form — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title" th:text="${formTitle}">Add / Edit Cadet</div>

    <!-- Global error messages -->
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
        <ul th:each="err : ${#fields.globalErrors()}" th:remove="tag">
            <li th:text="${err}">Error</li>
        </ul>
    </div>

    <div class="form-container">
        <form th:action="${cadetDTO.id != null ? '/cadets/edit/' + cadetDTO.id : '/cadets/add'}"
              th:object="${cadetDTO}"
              method="post"
              class="no-double-submit">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>

            <!-- Section: Personal Information -->
            <div style="font-weight:bold;color:#003580;margin-bottom:10px;
                        border-bottom:1px solid #ccd;padding-bottom:4px;">
                Personal Information
            </div>

            <div class="form-group">
                <label for="name" class="required">Full Name</label>
                <div>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                           placeholder="Alphabets only"/>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="dob" class="required">Date of Birth</label>
                <div>
                    <input type="date" id="dob" th:field="*{dob}" class="form-control"
                           th:classappend="${#fields.hasErrors('dob')} ? ' is-invalid' : ''"/>
                    <span th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="gender" class="required">Gender</label>
                <div>
                    <select id="gender" th:field="*{gender}" class="form-control"
                            th:classappend="${#fields.hasErrors('gender')} ? ' is-invalid' : ''">
                        <option value="">-- Select --</option>
                        <option th:each="g : ${genders}" th:value="${g}" th:text="${g}">MALE</option>
                    </select>
                    <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="fatherName">Father's Name</label>
                <div>
                    <input type="text" id="fatherName" th:field="*{fatherName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fatherName')} ? ' is-invalid' : ''"
                           placeholder="Alphabets only"/>
                    <span th:if="${#fields.hasErrors('fatherName')}" th:errors="*{fatherName}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>
                <select id="bloodGroup" th:field="*{bloodGroup}" class="form-control">
                    <option value="">-- Select --</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>O+</option><option>O-</option>
                    <option>AB+</option><option>AB-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aadhaar">Aadhaar Number</label>
                <div>
                    <input type="text" id="aadhaar" th:field="*{aadhaar}" class="form-control"
                           data-type="aadhaar"
                           th:classappend="${#fields.hasErrors('aadhaar')} ? ' is-invalid' : ''"
                           placeholder="12-digit Aadhaar (will be masked)"/>
                    <span th:if="${#fields.hasErrors('aadhaar')}" th:errors="*{aadhaar}" class="invalid-feedback"></span>
                    <small style="color:#666;">Stored as XXXX-XXXX-XXXX (last 4 digits visible)</small>
                </div>
            </div>

            <!-- Section: Contact Information -->
            <div style="font-weight:bold;color:#003580;margin:16px 0 10px;
                        border-bottom:1px solid #ccd;padding-bottom:4px;">
                Contact Information
            </div>

            <div class="form-group">
                <label for="email" class="required">Email</label>
                <div>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"/>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <div>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control"
                           data-type="phone"
                           th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid' : ''"
                           placeholder="10-digit mobile number"/>
                    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" th:field="*{address}" class="form-control"
                          placeholder="Full address"></textarea>
            </div>

            <div class="form-group">
                <label for="college">College / School</label>
                <input type="text" id="college" th:field="*{college}" class="form-control"
                       placeholder="Name of institution"/>
            </div>

            <!-- Section: NCC Details -->
            <div style="font-weight:bold;color:#003580;margin:16px 0 10px;
                        border-bottom:1px solid #ccd;padding-bottom:4px;">
                NCC Details
            </div>

            <div class="form-group">
                <label for="unitId">Unit</label>
                <select id="unitId" th:field="*{unitId}" class="form-control">
                    <option value="">-- Select Unit --</option>
                    <option th:each="unit : ${units}"
                            th:value="${unit.id}"
                            th:text="${unit.unitName}">Unit</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rank">Rank</label>
                <select id="rank" th:field="*{rank}" class="form-control">
                    <option value="">-- Select Rank --</option>
                    <option th:each="r : ${ranks}" th:value="${r}" th:text="${r}">CADET</option>
                </select>
            </div>

            <div class="form-group">
                <label for="enrollmentDate">Enrollment Date</label>
                <input type="date" id="enrollmentDate" th:field="*{enrollmentDate}" class="form-control"/>
            </div>

            <!-- Submit -->
            <div class="form-group" style="margin-top:20px;border-top:1px solid #ddd;padding-top:14px;">
                <label></label>
                <div>
                    <button type="submit" class="btn btn-primary">Save Cadet</button>
                    <a th:href="@{/cadets}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
