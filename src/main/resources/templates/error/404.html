<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>404 - Page Not Found — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="content-area">
<div class="container">
    <div class="error-page">
        <div class="error-code">404</div>
        <h2 th:text="${errorTitle ?: 'Page Not Found'}">Page Not Found</h2>
        <p th:text="${errorMessage ?: 'The page you are looking for does not exist or has been moved.'}">
            The page you are looking for does not exist or has been moved.
        </p>
        <a href="/login" class="btn btn-primary">Go to Login</a>
        <a onclick="history.back()" class="btn btn-secondary" style="cursor:pointer;">Go Back</a>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
