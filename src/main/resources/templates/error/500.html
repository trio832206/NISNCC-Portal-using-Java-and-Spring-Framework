<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Error — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="content-area">
<div class="container">
    <div class="error-page">
        <div class="error-code" th:text="${statusCode ?: 500}">500</div>
        <h2 th:text="${errorTitle ?: 'Internal Server Error'}">Internal Server Error</h2>
        <p th:text="${errorMessage ?: 'An unexpected error occurred. Please contact the system administrator.'}">
            An unexpected error occurred.
        </p>
        <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        <a href="/login" class="btn btn-primary">Go to Login</a>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
