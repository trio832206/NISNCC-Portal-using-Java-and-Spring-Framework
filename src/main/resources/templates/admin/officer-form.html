<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Officer Form — NCC Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="content-area">
<div class="container">

    <div class="page-title">Officer Management &mdash; Add / Edit Officer</div>

    <div class="form-container">
        <form th:action="${officerDTO.id != null ? '/admin/officers/edit/' + officerDTO.id : '/admin/officers/add'}"
              th:object="${officerDTO}"
              method="post"
              class="no-double-submit">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="name" class="required">Full Name</label>
                <div>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                           placeholder="Officer full name"/>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" th:field="*{designation}" class="form-control"
                       placeholder="e.g., Captain, ANO, Major"/>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"/>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <div>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control"
                           data-type="phone"
                           th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid' : ''"
                           placeholder="10-digit mobile number"/>
                    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="invalid-feedback"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="unitId">Assigned Unit</label>
                <select id="unitId" th:field="*{unitId}" class="form-control">
                    <option value="">-- Select Unit --</option>
                    <option th:each="unit : ${units}"
                            th:value="${unit.id}"
                            th:text="${unit.unitName}">Unit</option>
                </select>
            </div>

            <!-- Show username/password only for new officer -->
            <div th:if="${officerDTO.id == null}">
                <div class="form-group">
                    <label for="username" class="required">Username</label>
                    <div>
                        <input type="text" id="username" th:field="*{username}" class="form-control"
                               placeholder="Login username"/>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           placeholder="Leave blank for default: officer123"/>
                </div>
            </div>

            <div class="form-group">
                <label></label>
                <div>
                    <button type="submit" class="btn btn-primary">Save Officer</button>
                    <a th:href="@{/admin/officers}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
